<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8a8e);--link:var(--tg-theme-link-color,#2481cc);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f4);--danger:var(--tg-theme-destructive-text-color,#e53935);--ok:#2e9d57;--bd:rgba(127,127,127,.25)}

.cm-keyword{color:#a626a4}.cm-atom,.cm-number{color:#986801}.cm-def{color:#4078f2}.cm-string,.cm-string-2{color:#50a14f}.cm-comment{color:#a0a1a7;font-style:italic}.cm-tag{color:#e45649}.cm-attribute{color:#986801}.cm-builtin{color:#c18401}.cm-variable-2,.cm-type{color:#0184bc}.cm-property{color:#e45649}.cm-header,.cm-link{color:#4078f2}.cm-meta,.cm-qualifier{color:#986801}
html[data-dark="1"] .cm-keyword{color:#c678dd}html[data-dark="1"] .cm-atom,html[data-dark="1"] .cm-number{color:#d19a66}html[data-dark="1"] .cm-def{color:#61afef}html[data-dark="1"] .cm-string,html[data-dark="1"] .cm-string-2{color:#98c379}html[data-dark="1"] .cm-comment{color:#7f848e}html[data-dark="1"] .cm-tag,html[data-dark="1"] .cm-property{color:#e06c75}html[data-dark="1"] .cm-attribute,html[data-dark="1"] .cm-meta,html[data-dark="1"] .cm-qualifier{color:#d19a66}html[data-dark="1"] .cm-builtin{color:#e6c07b}html[data-dark="1"] .cm-variable-2,html[data-dark="1"] .cm-type{color:#56b6c2}html[data-dark="1"] .cm-header,html[data-dark="1"] .cm-link{color:#61afef}

.stat{padding:3px 10px;font-size:11px;color:var(--hint);background:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
pre.diff{margin:6px 0;overflow-x:auto;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--sec);border-radius:8px;padding:8px}
.dl{display:block;white-space:pre}.dl.a{background:rgba(46,157,87,.18)}.dl.d{background:rgba(229,57,53,.18)}.dl.h{color:var(--link)}
details{margin:8px 12px}summary{cursor:pointer;font-weight:600;word-break:break-all}
.add{color:var(--ok)}.del{color:var(--danger)}

<body>
<div id="root"><div id="hdr"></div><div id="app"></div><div id="foot"></div></div>
<div id="modal"></div>
<div id="busy"><div class="spin"></div><div id="busymsg"></div></div>
<div id="toast"></div>
<script>
(function () {
'use strict';
/* ───────────── basics ───────────── */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
const parentOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');
const baseOf = (p) => p.slice(p.lastIndexOf('/') + 1);
const cleanRepoName = (n) => (n.trim().replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^[-.]+|[-.]+$/g, '') || 'new-repo');
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'abhi';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 2592000) return Math.floor(s / 86400) + 'd';
  if (s < 31536000) return Math.floor(s / 2592000) + 'mo';
  return Math.floor(s / 31536000) + 'y';
}
function fileIcon(n) {
  const e = (n.split('.').pop() || '').toLowerCase();
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'ico', 'bmp'].includes(e)) return '🖼';
  return ({ md: '📝', json: '🧾', py: '🐍', js: '🟨', ts: '🟦', html: '🌐', css: '🎨', zip: '🗜', sh: '⚙️', yml: '⚙️', yaml: '⚙️' })[e] || '📄';
}

/* ───────────── storage (Telegram CloudStorage, fallback localStorage) ───────────── */
const Store = {
  cloud: !!(inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')),
  _t(p) { return Promise.race([p, sleep(4000).then(() => null)]); },
  get(k) {
    if (this.cloud) return this._t(new Promise((res) => { try { tg.CloudStorage.getItem(k, (e, v) => res(e ? null : (v || null))); } catch (e) { res(null); } }));
    try { return Promise.resolve(localStorage.getItem(k)); } catch (e) { return Promise.resolve(null); }
  },
  set(k, v) {
    if (this.cloud) return this._t(new Promise((res) => { try { tg.CloudStorage.setItem(k, v, (e) => res(!e)); } catch (e) { res(false); } }));
    try { localStorage.setItem(k, v); } catch (e) { /* ignore */ }
    return Promise.resolve(true);
  },
  del(k) {
    if (this.cloud) return this._t(new Promise((res) => { try { tg.CloudStorage.removeItem(k, () => res(true)); } catch (e) { res(false); } }));
    try { localStorage.removeItem(k); } catch (e) { /* ignore */ }
    return Promise.resolve(true);
  },
};

/* ───────────── bytes / text ───────────── */
const TE = new TextEncoder();
function b64FromBytes(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function bytesFromB64(b64) {
  const s = atob(String(b64).replace(/\s/g, ''));
  const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function textOf(bytes) { // string if valid utf-8 text, else null
  try {
    const t = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return t.indexOf('\u0000') === -1 ? t : null;
  } catch (e) { return null; }
}
async function pool(items, n, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

/* ───────────── GitHub API ───────────── */
const GH = {
  token: '', login: '',
  async req(method, path, body) {
    let url = path.startsWith('http') ? path : 'https://api.github.com' + path;
    if (method === 'GET') url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const r = await fetch(url, {
      method,
      headers: Object.assign({ Authorization: 'Bearer ' + this.token, Accept: 'application/vnd.github+json' }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      let m = r.statusText;
      try { const j = await r.json(); m = (j.message || m) + (j.errors ? ' ' + j.errors.map((e) => e.message || JSON.stringify(e)).join('; ') : ''); } catch (e) { /* ignore */ }
      throw new Error('GitHub ' + r.status + ': ' + m);
    }
    if (r.status === 204) return null;
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  },
  async all(path) {
    let out = [];
    for (let p = 1; p <= 10; p++) {
      const a = await this.req('GET', path + (path.includes('?') ? '&' : '?') + 'per_page=100&page=' + p);
      out = out.concat(a);
      if (a.length < 100) break;
    }
    return out;
  },
  async scopes() {
    const r = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + this.token } });
    return r.headers.get('x-oauth-scopes');
  },
};

/* ───────────── state ───────────── */
const S = {
  repos: [], reposLoading: false, q: '', filter: 'all', sort: 'updated', select: false, picked: new Set(), recents: [],
  repo: null, branch: '', tab: 'files', path: '', items: [], commits: [], cpage: 1, cmore: false, branches: [], pages: null, treeCache: {},
  prefs: { wrap: true, font: 14 }, ai: { key: '', model: 'claude-sonnet-5-5', system: '' },
};
const stack = [];
let Edt = null; // editor session
const top = () => stack[stack.length - 1];
const full = () => S.repo.full_name;

/* ───────────── UI primitives ───────────── */
function setHeader(h) { $('#hdr').innerHTML = h; }
let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, isErr ? 5000 : 2300);
}
function busy(msg) {
  $('#busymsg').textContent = msg || '';
  $('#busy').style.display = 'flex';
  return () => { $('#busy').style.display = 'none'; };
}
async function withBusy(msg, fn) { const end = busy(msg); try { return await fn(); } finally { end(); } }
function openModal(html, o) {
  const m = $('#modal');
  m.innerHTML = '<div class="ov' + (o && o.top ? ' top' : '') + '"><div class="mbox">' + html + '</div></div>';
  m.style.display = 'block';
  return m.querySelector('.mbox');
}
function closeModal() { const m = $('#modal'); m.style.display = 'none'; m.innerHTML = ''; }
function ask(title, o) {
  o = o || {};
  return new Promise((res) => {
    const box = openModal('<h3>' + esc(title) + '</h3>' + (o.hint ? '<p class="hint">' + esc(o.hint) + '</p>' : '') +
      (o.multiline ? '<textarea id="m-in" rows="6"></textarea>' : '<input id="m-in" autocomplete="off" autocapitalize="off" spellcheck="false">') +
      '<div class="mrow"><button class="btn ghost" id="m-no">Cancel</button><button class="btn" id="m-ok">' + esc(o.okText || 'OK') + '</button></div>');
    const inp = box.querySelector('#m-in'); inp.value = o.value || ''; inp.placeholder = o.placeholder || '';
    setTimeout(() => inp.focus(), 60);
    const done = (v) => { closeModal(); res(v); };
    box.querySelector('#m-no').onclick = () => done(null);
    box.querySelector('#m-ok').onclick = () => done(inp.value);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !o.multiline) { e.preventDefault(); done(inp.value); } });
  });
}
function confirmBox(title, text, o) {
  o = o || {};
  return new Promise((res) => {
    const box = openModal('<h3>' + esc(title) + '</h3><p>' + esc(text || '') + '</p><div class="mrow"><button class="btn ghost" id="m-no">Cancel</button><button class="btn' + (o.danger ? ' danger' : '') + '" id="m-ok">' + esc(o.okText || 'OK') + '</button></div>');
    box.querySelector('#m-no').onclick = () => { closeModal(); res(false); };
    box.querySelector('#m-ok').onclick = () => { closeModal(); res(true); };
  });
}
function sheet(title, items) {
  return new Promise((res) => {
    const box = openModal('<h3>' + esc(title) + '</h3>' + items.map((it, i) => '<div class="sitem' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' + esc(it.label) + '</div>').join('') + '<div class="sitem" data-i="-1" style="color:var(--hint)">Cancel</div>');
    box.addEventListener('click', (e) => {
      const el = e.target.closest('[data-i]'); if (!el) return;
      const i = Number(el.dataset.i); closeModal(); res(i < 0 ? null : items[i].id);
    });
  });
}
function picker(title, items, onPick, extra) { // items: [{label, sub, value}]
  const box = openModal('<h3>' + esc(title) + '</h3><input id="pk-q" placeholder="🔎 type karo..." autocomplete="off" autocapitalize="off" spellcheck="false"><div id="pk-l"></div>' +
    '<div class="mrow">' + (extra ? '<button class="btn ghost" id="pk-x">' + esc(extra.label) + '</button>' : '') + '<button class="btn ghost" id="pk-no">Close</button></div>');
  const inp = box.querySelector('#pk-q'); const list = box.querySelector('#pk-l');
  let cur = [];
  const draw = () => {
    const toks = inp.value.toLowerCase().split(/\s+/).filter(Boolean);
    cur = items.filter((it) => toks.every((t) => it.label.toLowerCase().includes(t))).slice(0, 60);
    list.innerHTML = cur.map((it, i) => '<div class="sitem" data-i="' + i + '">' + esc(it.label) + (it.sub ? '<div class="m">' + esc(it.sub) + '</div>' : '') + '</div>').join('') || '<p class="hint">Kuch nahi mila</p>';
  };
  inp.addEventListener('input', draw); draw(); setTimeout(() => inp.focus(), 60);
  list.addEventListener('click', (e) => { const el = e.target.closest('[data-i]'); if (!el) return; const v = cur[Number(el.dataset.i)].value; closeModal(); onPick(v); });
  box.querySelector('#pk-no').onclick = closeModal;
  if (extra) box.querySelector('#pk-x').onclick = () => extra.run(inp.value, box);
}

/* ───────────── git operations ───────────── */
const refQ = (b) => (b ? '?ref=' + encodeURIComponent(b) : '');
async function listDir(path, ref) {
  const items = await GH.req('GET', '/repos/' + full() + '/contents' + (path ? '/' + encPath(path) : '') + refQ(ref));
  if (!Array.isArray(items)) throw new Error('Ye file hai, folder nahi');
  return items.sort((a, b) => (a.type === 'dir' ? 0 : 1) - (b.type === 'dir' ? 0 : 1) || a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
}
async function readFile(path, ref) {
  const it = await GH.req('GET', '/repos/' + full() + '/contents/' + encPath(path) + refQ(ref));
  if (Array.isArray(it)) throw new Error('Ye folder hai, file nahi');
  let bytes;
  if (it.encoding === 'base64' && it.content) bytes = bytesFromB64(it.content);
  else bytes = bytesFromB64((await GH.req('GET', '/repos/' + full() + '/git/blobs/' + it.sha)).content);
  return { bytes, sha: it.sha };
}
function putFile(path, bytes, msg, sha, branch) {
  const body = { message: msg, content: b64FromBytes(bytes) };
  if (branch) body.branch = branch; if (sha) body.sha = sha;
  return GH.req('PUT', '/repos/' + full() + '/contents/' + encPath(path), body);
}
async function deleteFileApi(path, msg, branch) {
  const it = await GH.req('GET', '/repos/' + full() + '/contents/' + encPath(path) + refQ(branch));
  return GH.req('DELETE', '/repos/' + full() + '/contents/' + encPath(path), { message: msg, sha: it.sha, branch });
}
async function headInfo(fullName, branch) {
  const ref = await GH.req('GET', '/repos/' + fullName + '/git/ref/heads/' + encPath(branch));
  const parent = ref.object.sha;
  const c = await GH.req('GET', '/repos/' + fullName + '/git/commits/' + parent);
  return { branch, parent, base: c.tree.sha };
}
async function commitEntries(fullName, branch, parent, base, entries, message, replace) {
  let tree = replace ? null : base;
  for (let i = 0; i < entries.length; i += 100) {
    const body = { tree: entries.slice(i, i + 100) };
    if (tree) body.base_tree = tree;
    tree = (await GH.req('POST', '/repos/' + fullName + '/git/trees', body)).sha;
  }
  const c = await GH.req('POST', '/repos/' + fullName + '/git/commits', { message, tree, parents: [parent] });
  await GH.req('PATCH', '/repos/' + fullName + '/git/refs/heads/' + encPath(branch), { sha: c.sha });
}
async function pushFiles(fullName, branch, files, message, replace) { // files: [[path, Uint8Array]]
  let h = null;
  for (let i = 0; i < 10 && !h; i++) { try { h = await headInfo(fullName, branch); } catch (e) { await sleep(1000); } }
  if (!h) throw new Error('Branch ready nahi hui, thodi der baad try karo');
  const entries = await pool(files, 6, async (f) => {
    const t = textOf(f[1]);
    if (t !== null && t !== '') return { path: f[0], mode: '100644', type: 'blob', content: t };
    const b = await GH.req('POST', '/repos/' + fullName + '/git/blobs', { content: b64FromBytes(f[1]), encoding: 'base64' });
    return { path: f[0], mode: '100644', type: 'blob', sha: b.sha };
  });
  await commitEntries(fullName, branch, h.parent, h.base, entries, message, replace);
}
async function blobsUnder(fullName, base, prefix) {
  const t = await GH.req('GET', '/repos/' + fullName + '/git/trees/' + base + '?recursive=1');
  if (t.truncated) throw new Error('Repo bahut bada hai, ye action abhi support nahi');
  return { all: t.tree, hits: t.tree.filter((e) => e.type === 'blob' && (e.path === prefix || e.path.startsWith(prefix + '/'))) };
}
async function deletePath(prefix, branch) {
  const h = await headInfo(full(), branch);
  const { hits } = await blobsUnder(full(), h.base, prefix);
  if (!hits.length) throw new Error('Is path me kuch nahi mila');
  await commitEntries(full(), branch, h.parent, h.base, hits.map((e) => ({ path: e.path, mode: e.mode, type: 'blob', sha: null })), 'Delete ' + prefix + ' via Mini App');
  return hits.length;
}
async function movePath(oldP, newP, branch) {
  const h = await headInfo(full(), branch);
  const { all, hits } = await blobsUnder(full(), h.base, oldP);
  if (!hits.length) throw new Error('Purana path nahi mila');
  if (newP === oldP || newP.startsWith(oldP + '/')) throw new Error('Naya path purane ke andar nahi ho sakta');
  if (all.some((e) => e.type === 'blob' && (e.path === newP || e.path.startsWith(newP + '/')))) throw new Error('"' + newP + '" pehle se hai');
  const entries = [];
  hits.forEach((e) => {
    entries.push({ path: e.path, mode: e.mode, type: 'blob', sha: null });
    entries.push({ path: newP + e.path.slice(oldP.length), mode: e.mode, type: 'blob', sha: e.sha });
  });
  await commitEntries(full(), branch, h.parent, h.base, entries, 'Move ' + oldP + ' -> ' + newP + ' via Mini App');
  return hits.length;
}
async function treePaths(branch) {
  if (S.treeCache[branch]) return S.treeCache[branch];
  const t = await GH.req('GET', '/repos/' + full() + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1');
  S.treeCache[branch] = t.tree.filter((e) => e.type === 'blob').map((e) => e.path);
  return S.treeCache[branch];
}
async function readZipFile(file) {
  if (!window.JSZip) throw new Error('JSZip load nahi hua (internet check karo)');
  const z = await JSZip.loadAsync(file);
  let files = [];
  for (const n of Object.keys(z.files)) {
    const f = z.files[n];
    if (f.dir || /(^|\/)(__MACOSX|\.git)\//.test(n) || /\.DS_Store$/.test(n)) continue;
    files.push([n, await f.async('uint8array')]);
  }
  if (!files.length) throw new Error('Zip khaali hai');
  const tops = new Set(files.map((f) => f[0].split('/')[0]));
  if (tops.size === 1 && files.every((f) => f[0].includes('/'))) files = files.map((f) => [f[0].split('/').slice(1).join('/'), f[1]]);
  return files;
}

/* ───────────── editor abstraction (CodeMirror 5 / textarea fallback) ───────────── */
function modeFor(name) {
  const n = name.toLowerCase(); const ext = n.includes('.') ? n.split('.').pop() : n;
  const M = { js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript', ts: { name: 'javascript', typescript: true }, tsx: { name: 'javascript', typescript: true }, json: { name: 'javascript', json: true }, html: 'htmlmixed', htm: 'htmlmixed', vue: 'htmlmixed', css: 'css', scss: 'css', xml: 'xml', svg: 'xml', py: 'python', md: 'markdown', markdown: 'markdown', sh: 'shell', bash: 'shell', zsh: 'shell', yml: 'yaml', yaml: 'yaml', c: 'text/x-csrc', h: 'text/x-csrc', cpp: 'text/x-c++src', cc: 'text/x-c++src', hpp: 'text/x-c++src', java: 'text/x-java', cs: 'text/x-csharp', kt: 'text/x-kotlin', sql: 'text/x-sql', php: 'application/x-httpd-php', go: 'go', rs: 'rust', toml: 'toml', dockerfile: 'dockerfile' };
  return M[ext] || null;
}
function createEditor(host, text, filename) {
  const api = {};
  if (window.CodeMirror) {
    const cm = window.CodeMirror(host, {
      value: text, lineNumbers: true, lineWrapping: S.prefs.wrap, mode: modeFor(filename), indentUnit: 4, tabSize: 4,
      matchBrackets: true, styleActiveLine: true,
      extraKeys: { Tab: (c) => (c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    ', 'end')), 'Shift-Tab': (c) => c.indentSelection('subtract') },
    });
    host.style.fontSize = S.prefs.font + 'px';
    Object.assign(api, {
      get: () => cm.getValue(),
      replaceAll(t) { const cur = cm.getCursor(); const l = cm.lastLine(); cm.replaceRange(t, { line: 0, ch: 0 }, { line: l, ch: cm.getLine(l).length }); try { cm.setCursor(cur); } catch (e) { /* ignore */ } },
      insert(t) { cm.replaceSelection(t, 'end'); cm.focus(); },
      undo() { cm.undo(); cm.focus(); }, redo() { cm.redo(); cm.focus(); },
      focus() { cm.focus(); }, refresh() { cm.refresh(); },
      onChange(f) { cm.on('change', f); }, onCursor(f) { cm.on('cursorActivity', f); },
      pos() { const c = cm.getCursor(); return { line: c.line + 1, col: c.ch + 1 }; },
      lines: () => cm.lineCount(),
      cursorIndex: () => cm.indexFromPos(cm.getCursor('to')),
      select(a, b) { cm.setSelection(cm.posFromIndex(a), cm.posFromIndex(b)); cm.scrollIntoView(null, 120); },
      goto(n) { const l = Math.max(0, Math.min(cm.lineCount() - 1, n - 1)); cm.setCursor({ line: l, ch: 0 }); cm.scrollIntoView({ line: l, ch: 0 }, 120); cm.focus(); },
      setWrap(b) { cm.setOption('lineWrapping', b); cm.refresh(); },
      setFont(px) { host.style.fontSize = px + 'px'; cm.refresh(); },
    });
  } else {
    const ta = document.createElement('textarea');
    ta.className = 'ta'; ta.value = text; ta.spellcheck = false; ta.setAttribute('autocapitalize', 'off'); ta.style.fontSize = S.prefs.font + 'px';
    host.appendChild(ta);
    const cb = []; const cc = [];
    ta.addEventListener('input', () => cb.forEach((f) => f()));
    ['keyup', 'click'].forEach((ev) => ta.addEventListener(ev, () => cc.forEach((f) => f())));
    Object.assign(api, {
      get: () => ta.value,
      replaceAll(t) { ta.value = t; cb.forEach((f) => f()); },
      insert(t) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); cb.forEach((f) => f()); ta.focus(); },
      undo() { document.execCommand('undo'); }, redo() { document.execCommand('redo'); },
      focus() { ta.focus(); }, refresh() {},
      onChange(f) { cb.push(f); }, onCursor(f) { cc.push(f); },
      pos() { const b = ta.value.slice(0, ta.selectionStart).split('\n'); return { line: b.length, col: b[b.length - 1].length + 1 }; },
      lines: () => ta.value.split('\n').length,
      cursorIndex: () => ta.selectionEnd,
      select(a, b) { ta.setSelectionRange(a, b); },
      goto(n) { const ls = ta.value.split('\n'); let i = 0; for (let k = 0; k < Math.min(n - 1, ls.length - 1); k++) i += ls[k].length + 1; ta.setSelectionRange(i, i); ta.focus(); },
      setWrap(b) { ta.style.whiteSpace = b ? 'pre-wrap' : 'pre'; }, setFont(px) { ta.style.fontSize = px + 'px'; },
    });
    api.setWrap(S.prefs.wrap);
  }
  return api;
}

function normPath(p) {
  const parts = p.trim().split('/').filter(Boolean);
  if (!parts.length || parts.some((x) => x === '.' || x === '..') || parts[0] === '.git') return null;
  return parts.join('/');
}
function findPanel() {
  const e = Edt; if (!e || !e.ed) return;
  const box = openModal('<input id="fr-f" placeholder="Find" autocomplete="off" autocapitalize="off" spellcheck="false"><input id="fr-r" placeholder="Replace with" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<label class="chk"><input type="checkbox" id="fr-x"> Regex</label><div class="mrow"><button class="btn ghost sm" id="fr-n">Next</button><button class="btn sm" id="fr-a">Replace all</button><button class="btn ghost sm" id="fr-c">Close</button></div>', { top: true });
  const f = box.querySelector('#fr-f'); const r = box.querySelector('#fr-r'); const x = box.querySelector('#fr-x');
  const build = () => { if (!f.value) return null; try { return x.checked ? new RegExp(f.value, 'g') : null; } catch (err) { toast('Regex galat hai', true); return undefined; } };
  box.querySelector('#fr-n').onclick = () => {
    const re = build(); if (re === undefined || !f.value) return;
    const text = e.ed.get(); const start = e.ed.cursorIndex(); let idx = -1; let len = 0;
    if (re) { re.lastIndex = start; let m = re.exec(text); if (!m) { re.lastIndex = 0; m = re.exec(text); } if (m) { idx = m.index; len = m[0].length || 1; } }
    else { idx = text.indexOf(f.value, start); if (idx < 0) idx = text.indexOf(f.value); len = f.value.length; }
    if (idx < 0) return toast('Nahi mila'); e.ed.select(idx, idx + len);
  };
  box.querySelector('#fr-a').onclick = () => {
    const re = build(); if (re === undefined || !f.value) return;
    const text = e.ed.get(); let n; let out;
    if (re) { n = (text.match(re) || []).length; out = text.replace(re, r.value); }
    else { n = text.split(f.value).length - 1; out = text.split(f.value).join(r.value); }
    if (!n) return toast('Nahi mila'); e.ed.replaceAll(out); toast(n + ' jagah replace hua');
  };
  box.querySelector('#fr-c').onclick = closeModal;
  setTimeout(() => f.focus(), 60);
}

async function bulkAction(kind) {
  const names = Array.from(S.picked); if (!names.length) return;
  if (kind === 'delete') {
    const t = await ask(names.length + ' repo delete honge', { hint: 'Ye undo nahi hota. Confirm ke liye DELETE likho.\n' + names.slice(0, 8).join(', '), okText: 'Delete' });
    if (t !== 'DELETE') return t === null ? undefined : toast('Cancel (DELETE nahi likha)', true);
  } else if (!(await confirmBox(names.length + ' repo: ' + kind, names.slice(0, 8).join(', '), { okText: 'Haan' }))) return;
  const fails = []; const end = busy('0/' + names.length);
  for (let i = 0; i < names.length; i++) {
    $('#busymsg').textContent = (i + 1) + '/' + names.length + ' ' + names[i];
    try {
      const path = '/repos/' + GH.login + '/' + encodeURIComponent(names[i]);
      if (kind === 'delete') { await GH.req('DELETE', path); S.repos = S.repos.filter((r) => r.name !== names[i]); }
      else {
        const body = { private: { private: true }, public: { private: false }, archive: { archived: true }, unarchive: { archived: false } }[kind];
        const r = await GH.req('PATCH', path, body); const k = S.repos.findIndex((x) => x.name === names[i]); if (k >= 0) S.repos[k] = Object.assign(S.repos[k], r);
      }
    } catch (err) { fails.push(names[i] + ': ' + err.message); }
  }
  end(); S.picked.clear(); vRepos();
  if (fails.length) toast(fails.length + ' fail:\n' + fails[0], true); else toast('✅ Ho gaya');
}

  'r-refresh': () => loadRepos(),
  'r-select': () => { S.select = !S.select; S.picked.clear(); vRepos(); },
  'r-new': () => newRepoFlow(),
  'r-settings': () => push({ view: 'settings' }),
  'r-filter': (d) => { S.filter = d.v; vRepos(); },
  'r-sort': () => { S.sort = { updated: 'name', name: 'stars', stars: 'updated' }[S.sort]; vRepos(); },
  'r-bulk': (d) => bulkAction(d.v),
  'repo-tap': (d) => {
    if (S.select) { if (S.picked.has(d.repo)) S.picked.delete(d.repo); else S.picked.add(d.repo); return renderRepoList(); }
    return openRepo(d.repo);
  },
  tab: (d) => { S.tab = d.v; vRepo(); },
  cd: (d) => { S.path = d.path; loadTab(); },
  'open-file': (d) => openFile(d.path),
  reload: () => loadTab(),
  async 'item-menu'(d) {
    const isDir = d.type === 'dir';
    const a = await sheet(d.path, [{ id: 'move', label: '🔀 Rename / Move' }, { id: 'copy', label: '📋 Path copy' }, { id: 'del', label: isDir ? '🗑 Folder delete' : '🗑 File delete', danger: true }]);
    if (a === 'copy') return copyText(d.path);
    if (a === 'move') {
      const np = await ask('Naya poora path', { value: d.path, okText: 'Move' }); if (!np || np.trim() === d.path) return;
      const c = normPath(np); if (!c) return toast('Path galat hai', true);
      await withBusy('Move ho raha hai...', () => movePath(d.path, c, S.branch)); S.treeCache = {}; toast('✅ Move ho gaya'); return loadTab();
    }
    if (a === 'del') {
      if (!(await confirmBox('Delete?', d.path + (isDir ? '\n(folder ki saari files)' : ''), { danger: true, okText: 'Delete' }))) return;
      await withBusy('Delete ho raha hai...', () => deletePath(d.path, S.branch)); S.treeCache = {}; toast('🗑 Delete ho gaya'); return loadTab();
    }
  },
  async 'f-new'() {
    const n = await ask('Naya file ka naam', { placeholder: 'main.py ya src/utils.js', hint: S.path ? 'Folder: ' + S.path : 'Root me', okText: 'Banao' }); if (!n) return;
    const p = normPath(S.path ? S.path + '/' + n : n); if (!p) return toast('Naam galat hai', true);
    newFileEditor(p);
  },
  async 'f-upload'() {
    const files = await pickFiles({ multiple: true }); if (!files.length) return;
    const entries = [];
    for (const f of files) entries.push([S.path ? S.path + '/' + f.name : f.name, new Uint8Array(await f.arrayBuffer())]);
    await withBusy('Upload ho raha hai...', () => pushFiles(full(), S.branch, entries, 'Upload ' + files.length + ' file(s) via Mini App', false));
    S.treeCache = {}; toast('✅ ' + files.length + ' file upload'); loadTab();
  },
  async 'f-zip'() {
    const f = (await pickFiles({ accept: '.zip,application/zip' }))[0]; if (!f) return;
    const mode = await sheet('Zip kaise lagana hai?', [{ id: 'merge', label: '➕ Merge (add/overwrite, purani files rahengi)' }, { id: 'replace', label: '♻️ Replace (purani saari files hat jayengi)', danger: true }]);
    if (!mode) return;
    await withBusy('Zip upload ho raha hai...', async () => { const files = await readZipFile(f); await pushFiles(full(), S.branch, files, (mode === 'replace' ? 'Replace' : 'Update') + ' files via Mini App', mode === 'replace'); });
    S.treeCache = {}; toast('✅ Zip lag gaya'); loadTab();
  },
  async 'pick-branch'() {
    const bs = S.branches.length ? S.branches : await withBusy('Branches...', () => GH.all('/repos/' + full() + '/branches')); S.branches = bs;
    const n = await sheet('Branch chuno', bs.map((b) => ({ id: b.name, label: (b.name === S.branch ? '✅ ' : '🌿 ') + b.name })));
    if (n && n !== S.branch) { S.branch = n; S.path = ''; S.treeCache = {}; vRepo(); }
  },
  'switch-repo': () => pickRepoSwitcher(),
  'search-files': () => searchFiles(),
  async 'repo-menu'() {
    const a = await sheet(S.repo.full_name, [{ id: 'gh', label: '🔗 GitHub pe kholo' }, { id: 'refresh', label: '🔄 Refresh' }, { id: 'clone', label: '📋 Clone URL copy' }]);
    if (a === 'gh') openLink(S.repo.html_url); if (a === 'refresh') { S.treeCache = {}; S.branches = []; vRepo(); } if (a === 'clone') copyText(S.repo.clone_url);
  },
  commit: (d) => push({ view: 'diff', sha: d.sha }),
  async 'more-commits'() { S.cpage++; await loadCommits(); $('#tabbody').innerHTML = commitsHtml(); },
  async 'b-new'() {
    const n = await ask('Nayi branch ka naam', { hint: '"' + S.branch + '" se banegi', okText: 'Banao' }); if (!n) return;
    const name = n.trim().replace(/[^A-Za-z0-9._/-]+/g, '-').replace(/^[-/.]+|[-/.]+$/g, ''); if (!name) return toast('Naam galat hai', true);
    await withBusy('Branch ban rahi hai...', async () => {
      const h = await headInfo(full(), S.branch);
      await GH.req('POST', '/repos/' + full() + '/git/refs', { ref: 'refs/heads/' + name, sha: h.parent });
    });
    S.branch = name; S.path = ''; S.treeCache = {}; S.branches = []; toast('✅ Branch ban gayi'); vRepo();
  },
  async 'b-tap'(d) {
    const n = d.name; const isDef = n === S.repo.default_branch;
    const a = await sheet('🌿 ' + n, [{ id: 'sw', label: '✅ Is branch pe kaam karo' }, { id: 'def', label: '⭐ Default banao' }, { id: 'mg', label: '🔀 Merge → ' + S.branch }, { id: 'pr', label: '📬 Pull Request kholo' }, { id: 'del', label: '🗑 Branch delete', danger: true }]);
    if (!a) return;
    if (a === 'sw') { S.branch = n; S.path = ''; S.treeCache = {}; return vRepo(); }
    if (a === 'def') { updateRepoLocal(await withBusy('Default badal raha hu...', () => GH.req('PATCH', '/repos/' + full(), { default_branch: n }))); toast('⭐ Default: ' + n); return loadTab(); }
    if (a === 'mg') {
      if (n === S.branch) return toast('Branch khud me merge nahi hoti', true);
      const r = await withBusy('Merge ho raha hai...', () => GH.req('POST', '/repos/' + full() + '/merges', { base: S.branch, head: n }));
      toast(r ? '✅ ' + n + ' → ' + S.branch + ' merge' : 'Pehle se up-to-date'); return;
    }
    if (a === 'pr') {
      const title = await ask('PR title', { value: n, okText: 'Create' }); if (!title) return;
      const base = n === S.repo.default_branch ? S.branch : S.repo.default_branch;
      const pr = await withBusy('PR ban rahi hai...', () => GH.req('POST', '/repos/' + full() + '/pulls', { title, head: n, base }));
      toast('✅ PR #' + pr.number); return openLink(pr.html_url);
    }
    if (a === 'del') {
      if (isDef) return toast('Default branch delete nahi hoti', true);
      if (!(await confirmBox('Branch delete?', n, { danger: true, okText: 'Delete' }))) return;
      await withBusy('Delete...', () => GH.req('DELETE', '/repos/' + full() + '/git/refs/heads/' + encPath(n)));
      if (S.branch === n) { S.branch = S.repo.default_branch; } S.branches = []; toast('🗑 Branch delete'); vRepo();
    }
  },
  async 's-rename'() {
    const n = await ask('Naya repo naam', { value: S.repo.name, okText: 'Rename' }); if (!n) return;
    const r = await withBusy('Rename...', () => GH.req('PATCH', '/repos/' + full(), { name: cleanRepoName(n) })); updateRepoLocal(r); toast('✅ Rename ho gaya'); vRepo();
  },
  async 's-desc'() {
    const n = await ask('Description', { value: S.repo.description || '', okText: 'Save' }); if (n === null) return;
    updateRepoLocal(await withBusy('Save...', () => GH.req('PATCH', '/repos/' + full(), { description: n }))); toast('✅ Save'); loadTab();
  },
  async 's-vis'() {
    const toPublic = S.repo.private;
    if (!(await confirmBox(toPublic ? 'Public karna hai?' : 'Private karna hai?', toPublic ? 'Sab log code dekh payenge.' : 'Sirf tum dekh paoge.', { okText: 'Haan', danger: toPublic }))) return;
    updateRepoLocal(await withBusy('Badal raha hu...', () => GH.req('PATCH', '/repos/' + full(), { private: !toPublic }))); vRepo();
  },
  async 's-archive'() {
    updateRepoLocal(await withBusy('...', () => GH.req('PATCH', '/repos/' + full(), { archived: !S.repo.archived }))); loadTab();
  },
  async 's-default'() {
    const bs = S.branches.length ? S.branches : await withBusy('Branches...', () => GH.all('/repos/' + full() + '/branches')); S.branches = bs;
    const n = await sheet('Default branch', bs.map((b) => ({ id: b.name, label: b.name }))); if (!n) return;
    updateRepoLocal(await withBusy('...', () => GH.req('PATCH', '/repos/' + full(), { default_branch: n }))); loadTab();
  },
  async 's-pages-on'() {
    await withBusy('Pages ON ho raha hai...', () => GH.req('POST', '/repos/' + full() + '/pages', { source: { branch: S.repo.default_branch, path: '/' } }));
    toast('✅ Pages ON (1-2 min me live)'); loadTab();
  },
  async 's-pages-off'() { await withBusy('...', () => GH.req('DELETE', '/repos/' + full() + '/pages')); toast('Pages band'); loadTab(); },
  's-open': () => openLink(S.repo.html_url),
  's-copy': () => copyText(S.repo.clone_url),
  async 's-delete'() {
    const t = await ask('Repo delete', { hint: 'Ye undo nahi hota. Confirm ke liye repo ka naam likho: ' + S.repo.name, okText: 'Delete' });
    if (t === null) return; if (t.trim() !== S.repo.name) return toast('Naam match nahi hua', true);
    await withBusy('Delete ho raha hai...', () => GH.req('DELETE', '/repos/' + full()));
    S.repos = S.repos.filter((r) => r.id !== S.repo.id); stack.length = 1; render(); toast('🗑 Repo delete ho gaya');
  },
  'e-save': () => saveFile(),
  'e-menu': () => editorMenu(),
  async 'g-logout'() {
    if (!(await confirmBox('Logout?', 'Token hat jayega.', { danger: true, okText: 'Logout' }))) return;
    await Store.del('gh_token'); GH.token = ''; S.repos = []; stack.length = 0; stack.push({ view: 'setup' }); render();
  },
  'g-wrap': () => { S.prefs.wrap = !S.prefs.wrap; savePrefs(); vSettings(); },
  'g-font': (d) => { S.prefs.font = Math.max(10, Math.min(24, S.prefs.font + Number(d.v))); savePrefs(); vSettings(); },
  async 'g-aikey'() { const v = await ask('Anthropic API key', { placeholder: 'sk-ant-...', okText: 'Save' }); if (v === null) return; S.ai.key = v.trim(); await Store.set('ai_key', S.ai.key); vSettings(); },
  async 'g-aimodel'() { const v = await ask('Model naam', { value: S.ai.model, okText: 'Save' }); if (!v) return; S.ai.model = v.trim(); await Store.set('ai_model', S.ai.model); vSettings(); },
  async 'g-aisys'() { const v = await ask('System prompt (khaali = default)', { value: S.ai.system, multiline: true, okText: 'Save' }); if (v === null) return; S.ai.system = v.trim(); await Store.set('ai_sys', S.ai.system.slice(0, 3500)); vSettings(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  Promise.resolve().then(() => fn(el.dataset, el, e)).catch((err) => { toast(err && err.message ? err.message : String(err), true); });
});
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest && e.target.closest('[data-ins]'); if (!b) return;
  e.preventDefault();
  if (!Edt || !Edt.ed) return;
  const v = b.dataset.ins;
  if (v === '__undo') Edt.ed.undo(); else if (v === '__redo') Edt.ed.redo(); else Edt.ed.insert(v === '__tab' ? '    ' : v);
});

/* ───────────── boot ───────────── */
function applyTheme() { document.documentElement.dataset.dark = tg && tg.colorScheme === 'dark' ? '1' : ''; }
async function boot() {
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); tg.BackButton.onClick(pop); tg.onEvent('themeChanged', applyTheme); } catch (e) { /* ignore */ }
    applyTheme();
  }
  const [tok, prefs, rec, key, model, sys] = await Promise.all(['gh_token', 'prefs', 'recents', 'ai_key', 'ai_model', 'ai_sys'].map((k) => Store.get(k)));
  try { if (prefs) Object.assign(S.prefs, JSON.parse(prefs)); } catch (e) { /* ignore */ }
  try { if (rec) S.recents = JSON.parse(rec); } catch (e) { /* ignore */ }
  if (key) S.ai.key = key; if (model) S.ai.model = model; if (sys) S.ai.system = sys;
  if (!tok) { stack.push({ view: 'setup' }); return render(); }
  GH.token = tok;
  try {
    const u = await GH.req('GET', '/user'); GH.login = u.login;
    stack.push({ view: 'repos' }); render(); loadRepos();
  } catch (e) { stack.length = 0; stack.push({ view: 'setup', err: e.message }); render(); }
}
window.addEventListener('load', boot);
})();
</script>
</body>
